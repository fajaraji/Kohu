<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker","default":"Moment"},
  {"id":"title","type":"string","label":"Title","default":"Title"}
]'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<script src="gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0f1722; }
  #root { position: relative; width: 100%; height: 100%; font-family: Inter, "DejaVu Sans", sans-serif; color: #f2f5f9; }
  .clip { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 140px; }
  .kicker { font-size: 24px; color: #ffd166; letter-spacing: 0.08em; text-transform: uppercase; }
  .title { margin-top: 14px; font-size: 54px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .bar { margin-top: 28px; height: 6px; width: 0; background: #2f6db5; border-radius: 3px; }
</style>
</head>
<body>
<div id="root" data-composition-id="card" data-start="0" data-duration="2.5" data-width="1280" data-height="720">
  <div id="c" class="clip" data-start="0" data-duration="2.5">
    <div class="kicker"></div><div class="title"></div><div class="bar"></div>
  </div>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  document.querySelector(".kicker").textContent = v.kicker;
  document.querySelector(".title").textContent = v.title;
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(".kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45 }, 0.05);
  tl.fromTo(".title", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5 }, 0.15);
  tl.to(".bar", { width: 360, duration: 0.9, ease: "power2.out" }, 0.3);
  tl.to("#c", { opacity: 0, duration: 0.3 }, 2.2);
  window.__timelines["card"] = tl;
  tl.seek(0);
</script>
</body>
</html>
