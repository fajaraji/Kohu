# Test on every push and pull request. On pushes to main or kohu-v2:
#   seed    reloads the demo database when KOHU_DATABASE_URL is set
#           (used by both the Vercel and the Cloudflare deploy)
#   deploy  deploys to Cloudflare Containers (paid plan) when the
#           CLOUDFLARE_* secrets are set; Vercel deploys itself through
#           its own Git integration and needs nothing here
# A job whose secrets are missing is skipped with a notice, not failed.
# See docs/deploy.md. No secret value is ever printed.
name: Test and deploy

on:
  push:
    branches: [main, kohu-v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      KOHU_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/kohu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r api/requirements.txt
      - run: python corpus/verify_corpus.py
      - run: python -m pytest -q tests

  seed:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/kohu-v2')
    runs-on: ubuntu-latest
    concurrency:
      group: kohu-seed
      cancel-in-progress: false
    steps:
      - id: check
        env:
          DB: ${{ secrets.KOHU_DATABASE_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::notice::Seed skipped. Add the KOHU_DATABASE_URL repository secret (see docs/deploy.md)"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == '1'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == '1'
        run: pip install -r api/requirements.txt
      # Seed from the committed corpus and model cache. No Meta key is passed
      # here, so seeding can never make a paid call. Safe to re-run.
      - if: steps.check.outputs.ready == '1'
        name: Seed the database
        env:
          DATABASE_URL: ${{ secrets.KOHU_DATABASE_URL }}
          KOHU_ALLOW_REMOTE_DB: "1"
        run: ./seed.sh

  deploy:
    needs: seed
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/kohu-v2')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: check
        env:
          DB: ${{ secrets.KOHU_DATABASE_URL }}
          META: ${{ secrets.META_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$DB" ] || missing="$missing KOHU_DATABASE_URL"
          [ -n "$META" ] || missing="$missing META_API_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::Cloudflare deploy skipped. Missing repository secrets:$missing (see docs/deploy.md)"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == '1'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.check.outputs.ready == '1'
        run: npm ci --no-audit --no-fund
      - if: steps.check.outputs.ready == '1'
        name: Deploy the Worker and container
        run: npx wrangler deploy
      - if: steps.check.outputs.ready == '1'
        name: Set the app secrets on the Worker
        env:
          S_DB: ${{ secrets.KOHU_DATABASE_URL }}
          S_META: ${{ secrets.META_API_KEY }}
          S_SESSION: ${{ secrets.KOHU_SESSION_SECRET }}
        run: |
          python3 -c '
          import json, os, secrets
          print(json.dumps({
              "DATABASE_URL": os.environ["S_DB"],
              "META_API_KEY": os.environ["S_META"],
              "KOHU_SESSION_SECRET": os.environ["S_SESSION"] or secrets.token_urlsafe(32),
              "META_SPEND_LIMIT_USD": "10"}))' | npx wrangler secret bulk
